name: android-build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 仓库根 build.gradle.kts 把 buildDirectory 重定向到该变量（默认 D:/smellmap-build，
      # 那是 Windows 开发机约定）。CI 上指向工作区内 ASCII 路径，产物/测试报告路径才可预测。
      TASTEMAP_BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Wrapper dist -> official URL on CI
        # 仓库里 distributionUrl 指向腾讯镜像（开发机在国内，services.gradle.org 不通）；
        # GitHub 拉不到该镜像，CI 上改回官方源
        run: sed -i 's#mirrors.cloud.tencent.com/gradle#services.gradle.org#' gradle/wrapper/gradle-wrapper.properties

      - name: Unit tests
        run: |
          ./gradlew test --stacktrace 2>&1 | tee gradle-run.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a gradle-run.log
          exit ${PIPESTATUS[0]}

      - name: Failure log to summary
        if: failure()
        run: |
          {
            echo "## Gradle log tail"
            echo '```'
            tail -120 gradle-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 注解匿名可读（API），把失败段也发一份
          { awk '/What went wrong|FAILURE: Build/{f=1} f{print; n++} n>20{exit}' gradle-run.log; tail -8 gradle-run.log; } \
            | tr '\n' '\001' | sed 's/\001/%0A/g' \
            | xargs -0 -I{} echo "::error title=gradle-tail::{}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/apk/debug/app-debug.apk
